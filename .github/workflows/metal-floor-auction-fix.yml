name: Apply auction metal-floor integration fix

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metal-floor-auction-fix.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate metal value into auction decision
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old = """   const dealerCap=Number.isFinite(bestDealerAllIn)?bestDealerAllIn:Number.POSITIVE_INFINITY;
   const valueAllIn=Math.min(fair*(1-safety),dealerCap*0.90);
   const fairAllIn=Math.min(fair,dealerCap*0.97);
   const collectorAllIn=Math.min(fair*(confidence==='Low'?1.02:1.08),dealerCap);
   const toHammer=x=>Math.max(0,(x-ship-fees)/(1+prem));
"""
          new = """   const dealerCap=Number.isFinite(bestDealerAllIn)?bestDealerAllIn:Number.POSITIVE_INFINITY;
   const meltEUR=auctionMetalFloor?.valueEUR;
   const currencyIsEUR=$('aCurrency').value==='EUR';
   const verifiedMetalFloorAllIn=(currencyIsEUR&&Number.isFinite(meltEUR)&&meltEUR>0)?meltEUR:null;
   const marketValueAllIn=Math.min(fair*(1-safety),dealerCap*0.90);
   const marketFairAllIn=Math.min(fair,dealerCap*0.97);
   const marketCollectorAllIn=Math.min(fair*(confidence==='Low'?1.02:1.08),dealerCap);
   const metalCappedFloor=Number.isFinite(verifiedMetalFloorAllIn)?Math.min(verifiedMetalFloorAllIn,dealerCap):null;
   const valueAllIn=Number.isFinite(metalCappedFloor)?Math.max(marketValueAllIn,metalCappedFloor):marketValueAllIn;
   const fairAllIn=Math.max(Math.min(marketFairAllIn,dealerCap),valueAllIn);
   const collectorAllIn=Math.max(Math.min(marketCollectorAllIn,dealerCap),fairAllIn);
   const toHammer=x=>Math.max(0,(x-ship-fees)/(1+prem));
   const metalMaxHammer=Number.isFinite(verifiedMetalFloorAllIn)?toHammer(verifiedMetalFloorAllIn):null;
"""
          if old not in s:
              raise SystemExit("ceiling block not found")
          s = s.replace(old, new, 1)

          old2 = """   const meltEUR=auctionMetalFloor?.valueEUR;
   const currencyIsEUR=$('aCurrency').value==='EUR';
   const belowMelt=mode==='buy'&&currencyIsEUR&&Number.isFinite(meltEUR)&&meltEUR>0&&allIn<meltEUR;
   if(belowMelt){status='STRONG BUY — BELOW METAL VALUE';cls='good'}
"""
          new2 = """   const belowMelt=mode==='buy'&&Number.isFinite(verifiedMetalFloorAllIn)&&allIn<verifiedMetalFloorAllIn;
   if(belowMelt){status='STRONG BUY — BELOW METAL VALUE';cls='good'}
"""
          if old2 not in s:
              raise SystemExit("below-melt block not found")
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Sanity check
        shell: bash
        run: |
          grep -q "verifiedMetalFloorAllIn" index.html
          grep -q "STRONG BUY — BELOW METAL VALUE" index.html

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Integrate metal value into Auction Intelligence decision"
          git push
