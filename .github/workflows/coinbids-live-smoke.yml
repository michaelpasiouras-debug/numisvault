name: CoinBids Live Smoke

on:
  push:
    paths:
      - 'index.html'
      - 'numisvault_backend.py'
      - 'coin_identity_resolver.py'
      - 'multilingual_country_aliases.py'
      - 'apply_multilingual_country_patch.py'
      - '.github/workflows/coinbids-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for production deployment and stress-test CoinBids
        env:
          BASE_URL: https://www.coinbids.eu
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base=os.environ['BASE_URL'].rstrip('/')

          def req_once(path, payload=None, timeout=70):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              headers={'User-Agent':'CoinBids-Live-Smoke/3.0'}
              if data is not None: headers['Content-Type']='application/json'
              r=urllib.request.Request(base+path,data=data,headers=headers,method='POST' if data is not None else 'GET')
              with urllib.request.urlopen(r,timeout=timeout) as h:
                  raw=h.read().decode('utf-8','replace')
                  return h.status, raw, (json.loads(raw) if 'application/json' in h.headers.get('Content-Type','') else None)

          def req(path, payload=None, timeout=70, attempts=3):
              last=None
              for attempt in range(attempts):
                  try:
                      return req_once(path,payload,timeout)
                  except urllib.error.HTTPError as e:
                      body=e.read().decode('utf-8','replace'); last=(e.code,body)
                      if e.code not in (502,503,504) or attempt==attempts-1: raise
                  except (urllib.error.URLError, TimeoutError) as e:
                      last=e
                      if attempt==attempts-1: raise
                  time.sleep(1.2*(attempt+1))
              raise RuntimeError(last)

          marker='Every click is a completely new Price Research run'
          last=None
          for attempt in range(12):
              try:
                  st,raw,_=req('/app',timeout=25,attempts=2)
                  if st==200 and 'CoinBids' in raw and marker in raw and 'activeAuctionController' in raw:
                      print('OK /app deployed with repeatable Price Research + Auction lifecycle')
                      break
                  last=f'/app HTTP {st}; price_marker={marker in raw}; auction_lifecycle={"activeAuctionController" in raw}'
              except Exception as e: last=f'{type(e).__name__}: {e}'
              print('waiting for production deployment:',last); time.sleep(20)
          else: raise SystemExit('Production did not deploy expected lifecycle: '+str(last))

          resolver_cases=[
              ('Griekenland 10 euro 2022 antikythera mechanism','Greece',2022),
              ('Griechenland 10 euro 2022 antikythera mechanism','Greece',2022),
              ('Grecia 10 euro 2022 meccanismo anticitera','Greece',2022),
              ('Grèce 10 euro 2022 mecanisme anticythere','Greece',2022),
              ('Ελλάδα 10 Ευρώ 2022 μηχανισμός αντικυθήρων','Greece',2022),
          ]
          for q,country,year in resolver_cases:
              st,raw,d=req('/api/resolve-coin',{'text':q},attempts=3)
              if st!=200 or not isinstance(d,dict): raise SystemExit(f'resolver failure {q!r}: {st} {raw[:300]}')
              best=d.get('best') or d.get('coin') or {}
              if best.get('country')!=country or int(best.get('year') or 0)!=year:
                  raise SystemExit(f'resolver semantic failure {q!r}: {best}')
              print('OK resolve',q,'->',best.get('country'),best.get('year'))

          def coin_search(q,currency='EUR'):
              payload={'raw_query':q,'coin':{'raw':q},'currency':currency,'include_shipping':True,'ship_to':'Greece','limit':2,'sample_limit':12}
              st,raw,d=req('/api/coin-search',payload,timeout=90,attempts=3)
              if st!=200 or not isinstance(d,dict): raise SystemExit(f'coin-search failure {q!r}: HTTP {st} {raw[:500]}')
              valid=int(d.get('valid_count') or len(d.get('offers') or []))
              if valid<1: raise SystemExit(f'coin-search no validated offers {q!r}: {raw[:900]}')
              best=d.get('cheapest_known_delivered') or d.get('best_offer') or ((d.get('offers') or [None])[0])
              if not best: raise SystemExit(f'coin-search missing best offer {q!r}')
              total=best.get('total') if isinstance(best,dict) else None; price=best.get('price') if isinstance(best,dict) else None
              if total is None and price is None: raise SystemExit(f'best offer has no price {q!r}: {best!r}')
              value=float(total if total is not None else price)
              print('OK market search',q,'valid=',valid,'best=',value)
              return value,d

          # Price -> Auction -> Price -> Auction -> Price. These use the same
          # production market endpoint the two UI engines share, deliberately
          # alternating coins/languages so stale state cannot hide behind cache.
          sequence=[
              ('PRICE','Greece 10 euro 2022 antikythera mechanism'),
              ('AUCTION','Griekenland 10 euro 2022 antikythera mechanism'),
              ('PRICE','Greece 5 euro 2021'),
              ('AUCTION','Greece 10 euro 2022 antikythera mechanism'),
              ('PRICE','Greece 10 euro 2022 antikythera mechanism'),
          ]
          anchors=[]
          for kind,q in sequence:
              value,data=coin_search(q); anchors.append((kind,q,value))

          same=[v for kind,q,v in anchors if '10 euro 2022 antikythera mechanism' in q.lower() or '10 euro 2022 antikythera mechanism' in q.lower()]
          if len(same)>=2:
              lo=min(same); hi=max(same)
              if hi/max(.01,lo)>1.35: raise SystemExit(f'alternating Price/Auction anchor divergence: {same}')

          # Exercise the Auction Intelligence V3 evidence endpoints repeatedly.
          manual_payload={'text':'2026-05-01 | 150 | EUR | BU | Test House | https://example.com/a\n2026-06-01 | 165 | EUR | Proof | Test House | https://example.com/b','default_currency':'EUR'}
          for idx in range(1,4):
              st,raw,d=req('/api/auction/comparables/manual',manual_payload,timeout=30,attempts=3)
              if st!=200 or not isinstance(d,dict) or len(d.get('comparables') or [])<2:
                  raise SystemExit(f'auction manual comparables #{idx} failed: HTTP {st} {raw[:700]}')
              print('OK auction comparables run',idx,'rows=',len(d.get('comparables') or []))

          try:
              st,raw,d=req('/api/metal-spot',timeout=30,attempts=2)
              if st==200: print('OK metal-spot live')
          except urllib.error.HTTPError as e:
              if e.code==503: print('WARN metal-spot provider unavailable (HTTP 503), endpoint reachable')
              else: raise

          print('SEQUENTIAL PRICE/AUCTION LIVE SMOKE: PASS')
          PY
