name: CoinBids Live Smoke

on:
  push:
    paths:
      - 'index.html'
      - 'numisvault_backend.py'
      - 'coin_identity_resolver.py'
      - 'multilingual_country_aliases.py'
      - 'apply_multilingual_country_patch.py'
      - '.github/workflows/coinbids-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for production deployment and smoke-test CoinBids
        env:
          BASE_URL: https://www.coinbids.eu
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base=os.environ['BASE_URL'].rstrip('/')

          def req_once(path, payload=None, timeout=70):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              headers={'User-Agent':'CoinBids-Live-Smoke/2.0'}
              if data is not None: headers['Content-Type']='application/json'
              r=urllib.request.Request(base+path,data=data,headers=headers,method='POST' if data is not None else 'GET')
              with urllib.request.urlopen(r,timeout=timeout) as h:
                  raw=h.read().decode('utf-8','replace')
                  return h.status, raw, (json.loads(raw) if 'application/json' in h.headers.get('Content-Type','') else None)

          def req(path, payload=None, timeout=70, attempts=3):
              last=None
              for attempt in range(attempts):
                  try:
                      return req_once(path,payload,timeout)
                  except urllib.error.HTTPError as e:
                      body=e.read().decode('utf-8','replace')
                      last=(e.code,body)
                      if e.code not in (502,503,504) or attempt==attempts-1:
                          raise
                  except (urllib.error.URLError, TimeoutError) as e:
                      last=e
                      if attempt==attempts-1: raise
                  time.sleep(1.2*(attempt+1))
              raise RuntimeError(last)

          # Wait until the DEPLOYED /app contains the repeated-research lifecycle
          # marker, not merely until an older CoinBids deployment is reachable.
          marker='Every click is a completely new Price Research run'
          last=None
          for attempt in range(12):
              try:
                  st,raw,_=req('/app',timeout=25,attempts=2)
                  if st==200 and 'CoinBids' in raw and marker in raw:
                      print('OK /app deployed with repeatable Price Research fix')
                      break
                  last=f'/app HTTP {st}; marker={marker in raw}'
              except Exception as e:
                  last=f'{type(e).__name__}: {e}'
              print('waiting for production deployment:',last)
              time.sleep(20)
          else:
              raise SystemExit('Production did not deploy the expected Price Research fix: '+str(last))

          resolver_cases=[
              ('Griekenland 10 euro 2022 antikythera mechanism','Greece',2022),
              ('Griechenland 10 euro 2022 antikythera mechanism','Greece',2022),
              ('Grecia 10 euro 2022 meccanismo anticitera','Greece',2022),
              ('Grèce 10 euro 2022 mecanisme anticythere','Greece',2022),
              ('Ελλάδα 10 Ευρώ 2022 μηχανισμός αντικυθήρων','Greece',2022),
          ]
          for q,country,year in resolver_cases:
              st,raw,d=req('/api/resolve-coin',{'text':q},attempts=3)
              if st!=200 or not isinstance(d,dict): raise SystemExit(f'resolver HTTP/data failure for {q!r}: {st} {raw[:300]}')
              best=d.get('best') or d.get('coin') or {}
              got_country=best.get('country'); got_year=best.get('year')
              if got_country!=country or int(got_year or 0)!=year:
                  raise SystemExit(f'resolver semantic failure {q!r}: country={got_country!r} year={got_year!r}; body={raw[:600]}')
              print('OK resolve',q,'->',got_country,got_year)

          # Repeated Price Research production path: first search, second search
          # in another language, then a THIRD search again in canonical wording.
          # All must independently complete. This explicitly guards the reported
          # "first research works, second does not" regression.
          searches=[
              'Greece 10 euro 2022 antikythera mechanism',
              'Griekenland 10 euro 2022 antikythera mechanism',
              'Greece 10 euro 2022 antikythera mechanism',
          ]
          results=[]
          for idx,q in enumerate(searches,1):
              payload={'raw_query':q,'coin':{'raw':q},'currency':'EUR','include_shipping':True,'ship_to':'Greece','limit':2,'sample_limit':12}
              st,raw,d=req('/api/coin-search',payload,timeout=90,attempts=3)
              if st!=200 or not isinstance(d,dict): raise SystemExit(f'coin-search #{idx} failure {q!r}: HTTP {st} {raw[:500]}')
              valid=int(d.get('valid_count') or len(d.get('offers') or []))
              if valid<1: raise SystemExit(f'coin-search #{idx} found no validated offers for {q!r}: {raw[:900]}')
              best=d.get('cheapest_known_delivered') or d.get('best_offer') or ((d.get('offers') or [None])[0])
              if not best: raise SystemExit(f'coin-search #{idx} has valid_count={valid} but no best offer for {q!r}')
              total=best.get('total') if isinstance(best,dict) else None
              price=best.get('price') if isinstance(best,dict) else None
              if total is None and price is None: raise SystemExit(f'best offer has no price/total for search #{idx}: {best!r}')
              results.append(float(total if total is not None else price))
              print('OK repeated search',idx,'valid=',valid,'best=',results[-1])

          for a,b in ((results[0],results[1]),(results[0],results[2])):
              if max(a,b)/max(0.01,min(a,b))>1.35:
                  raise SystemExit(f'repeated/multilingual price-anchor divergence: {a} vs {b}')

          try:
              st,raw,d=req('/api/metal-spot',timeout=30,attempts=2)
              if st==200: print('OK metal-spot live')
          except urllib.error.HTTPError as e:
              if e.code==503: print('WARN metal-spot provider unavailable (HTTP 503), endpoint itself reachable')
              else: raise

          print('LIVE SMOKE: PASS')
          PY
