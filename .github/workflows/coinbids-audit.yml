name: CoinBids Audit

on:
  push:
    paths:
      - '**.py'
      - '**.json'
      - '.github/workflows/coinbids-audit.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install Flask flask-cors requests beautifulsoup4
          fi
      - name: Apply verified catalog fixes
        run: python apply_coinbids_catalog_fixes.py
      - name: Existing regression suites
        run: |
          set -e
          [ ! -f test_resolver_regression.py ] || python test_resolver_regression.py
          [ ! -f test_search_filter_regression.py ] || python test_search_filter_regression.py
          [ ! -f test_theme_issue_matching.py ] || python test_theme_issue_matching.py
      - name: Full offline audit
        run: python coinbids_audit_v2.py --mode offline
      - name: Commit verified catalog fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- coin_specs_database_MASTER_EUROPE_v17.json; then
            echo 'No catalog changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add coin_specs_database_MASTER_EUROPE_v17.json
            git commit -m 'Apply verified CoinBids catalog audit fixes'
            git push
          fi
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinbids-audit-report
          path: |
            coinbids_audit_report.csv
            coinbids_audit_report.json
            coinbids_audit_summary.txt
