name: CoinBids Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install Flask flask-cors requests beautifulsoup4
          fi

      - name: Apply current verified patches
        run: |
          # Only idempotent patches that still target the current source remain
          # on the hot path. Older exact-anchor scripts are retired and must not
          # block deployment after their changes have already been absorbed.
          python apply_issue_alias_query_fix.py
          python apply_issue_alias_country_query_fix.py
          python apply_inferred_country_hard_filter_fix.py
          python apply_pdf_regression_fixes.py
          python apply_candidate_funnel_trace_fix.py
          python apply_mashops_checkpoint_detection_fix.py

      - name: Full repository structural audit
        run: python repo_health_audit.py

      - name: Compile every Python source file
        run: python -m compileall -q .

      - name: Validate embedded JavaScript in HTML files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          bad=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.I|re.S)
              local=[b for b in blocks if b.strip() and not re.match(r'^\s*\{',b)]
              for i,b in enumerate(local):
                  f=Path(tempfile.gettempdir())/f'coinbids_{p.stem}_{i}.js'
                  f.write_text(b,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: bad.append(f'{p} script#{i}: {r.stderr.strip()}')
          if bad:
              print('\n'.join(bad)); raise SystemExit(1)
          print('All embedded JavaScript blocks passed node --check')
          PY

      - name: Regression suites
        run: |
          set -e
          [ ! -f test_resolver_regression.py ] || python test_resolver_regression.py
          [ ! -f test_search_filter_regression.py ] || python test_search_filter_regression.py
          [ ! -f test_theme_issue_matching.py ] || python test_theme_issue_matching.py
          [ ! -f test_pdf_regressions.py ] || python test_pdf_regressions.py
          [ ! -f test_candidate_funnel_trace.py ] || python test_candidate_funnel_trace.py
          [ ! -f test_issue_alias_country_query.py ] || python test_issue_alias_country_query.py
          [ ! -f test_mashops_checkpoint_detection.py ] || python test_mashops_checkpoint_detection.py
          python test_multilingual_country_resolution.py
          python test_multilingual_market_matching.py
          python test_raw_only_api_fallback.py
          python test_repeated_price_research.py
          python test_coin_search_cache_key.py

      - name: Coin Search QA benchmark
        run: python test_coin_search_qa.py

      - name: Full CoinBids domain audit
        run: python coinbids_audit_v2.py --mode offline

      - name: Commit verified generated fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coin_specs_database.json coin_issue_database.json numisvault_backend.py index.html
          if git diff --cached --quiet; then
            echo 'No generated fixes to commit.'
          else
            git commit -m 'Apply verified MA-Shops checkpoint handling'
            git push
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinbids-audit-report
          path: |
            coinbids_audit_report.csv
            coinbids_audit_report.json
            coinbids_audit_summary.txt
            repo_health_audit_summary.txt
